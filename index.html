<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__top">
          <nav class="menu">
            <ul class="menu__list">
              <li class="menu__item">
                <a class="menu__link" href="#"> home </a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#"> activities </a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#"> pricing plan </a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#"> contact us </a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#"> blog </a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#"> about us </a>
              </li>
            </ul>
          </nav>
          <a class="header__phone" href="tel:+351912568342">
            <img src="images/phone-ico.svg" width="24" height="24" alt="icon" />
            +351912568342
          </a>
        </div>
        <img
          class="header__title-img"
          src="images/title.png"
          width="1702"
          height="149"
          alt=""
        />
        <h1 class="header__title visually-hidden">Surfing school</h1>
        <p class="header__text">Vilamoura. Portugal</p>
        <div class="header__content">
          <div class="header__content-info">
            <ul class="header__content-info-list">
              <li class="header__content-info-item">
                <h4>Privat lessons</h4>
              </li>
              <li class="header__content-info-item">
                <h4>Group lessons</h4>
              </li>
              <li class="header__content-info-item">
                <h4>Surf&sup rentals</h4>
              </li>
              <li class="header__content-info-item">
                <h4>Stand up puddle</h4>
              </li>
              <li class="header__content-info-item">
                <h4>Surf trips</h4>
              </li>
            </ul>
            <ul class="header__content-social-list">
              <li class="header__content-social-item">
                <a class="header__content-social-link" href="#">
                  <svg width="62" height="62">
                    <use xlink:href="images/sprite.svg#facebook"></use>
                  </svg>
                </a>
              </li>
              <li class="header__content-social-item">
                <a class="header__content-social-link" href="#">
                  <svg width="62" height="62">
                    <use xlink:href="images/sprite.svg#instagram"></use>
                  </svg>
                </a>
              </li>
              <li class="header__content-social-item">
                <a class="header__content-social-link" href="#">
                  <svg width="62" height="62">
                    <use xlink:href="images/sprite.svg#youtube"></use>
                  </svg>
                </a>
              </li>
              <li class="header__content-social-item">
                <a class="header__content-social-link" href="#">
                  <svg width="62" height="62">
                    <use xlink:href="images/sprite.svg#telegram"></use>
                  </svg>
                </a>
              </li>
            </ul>
          </div>
          <div class="header__content-news">
            <div class="header__content-news-box">
              <h3 class="header__content-news-title">NAZARE. BIG WAvE TRIP</h3>
              <time class="header__content-news-time" datetime="2025-02-10">
                10.02.2025
              </time>
              <a class="header__content-news-link"> more info </a>
              <picture header__content-news-img>
                <source srcset="images/news.avif" type="image/avif" />
                <source srcset="images/news.webp" type="image/webp" />
                <img src="images/.jpg" width="352" height="240" alt="" />
              </picture>
            </div>
            <div class="header__btns">
              <a class="header__btns-book" href="#"> book now </a>
              <a class="header__btns-activities" href="#"> activities </a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <script src="js/main.js"></script>
  </body>
</html>
